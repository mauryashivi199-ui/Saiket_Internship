<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Public REST API Explorer Pro | Saiket Internship</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #334155;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center">

  <!-- Header & Navbar -->
  <header class="w-full border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-30 px-4 md:px-8 py-4">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      
      <!-- Logo & Title -->
      <div class="flex items-center gap-3">
        <span class="p-2.5 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-500/30 text-2xl">🌐</span>
        <div>
          <h1 class="text-xl md:text-2xl font-bold bg-gradient-to-r from-blue-400 via-indigo-300 to-cyan-400 bg-clip-text text-transparent">
            REST API Data Explorer
          </h1>
          <p class="text-slate-400 text-xs">Saiket Internship • Task 2: Public API Integration</p>
        </div>
      </div>

      <!-- Live API Source Toggle -->
      <div class="flex items-center bg-slate-800/90 p-1 rounded-xl border border-slate-700/60">
        <button id="tabProducts" onclick="switchApi('products')" 
          class="px-4 py-1.5 text-xs font-semibold rounded-lg bg-blue-600 text-white shadow-sm transition">
          📦 Products API
        </button>
        <button id="tabUsers" onclick="switchApi('users')" 
          class="px-4 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition">
          👥 Users API
        </button>
      </div>

    </div>
  </header>

  <!-- Controls Bar: Search, Category Filter, Sort, Status -->
  <div class="w-full max-w-7xl px-4 md:px-8 py-6 space-y-4">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900 border border-slate-800 p-4 rounded-2xl">
      
      <!-- Search Input -->
      <div class="relative flex-1">
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔍</span>
        <input type="text" id="searchInput" placeholder="Search by title, category, name or email..."
          class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
      </div>

      <!-- Filters & Sort -->
      <div class="flex flex-wrap items-center gap-3">
        <!-- Sort Dropdown -->
        <select id="sortSelect" onchange="applyFiltersAndRender()"
          class="bg-slate-800 border border-slate-700 text-xs text-slate-300 rounded-xl px-3 py-2.5 focus:outline-none focus:border-blue-500">
          <option value="default">⚡ Default Order</option>
          <option value="price-low">💵 Price: Low to High</option>
          <option value="price-high">💰 Price: High to Low</option>
          <option value="rating-high">⭐ Highest Rated</option>
          <option value="name-asc">🔤 Name (A - Z)</option>
        </select>

        <!-- Refresh Button -->
        <button onclick="fetchCurrentApiData()" 
          class="flex items-center gap-1.5 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-600/30 px-4 py-2 rounded-xl text-xs font-semibold transition">
          <span>🔄</span> Refresh API
        </button>
      </div>

    </div>

    <!-- Status & Results Count Bar -->
    <div class="flex justify-between items-center text-xs text-slate-400 px-1">
      <div id="statusIndicator" class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="statusText">Ready</span>
      </div>
      <div id="resultsCount">Showing 0 records</div>
    </div>
  </div>

  <!-- Main Grid Container -->
  <main class="w-full max-w-7xl px-4 md:px-8 pb-16 flex-1">
    
    <!-- Skeleton Loading -->
    <div id="loadingSkeleton" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- 8 skeletons -->
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl animate-pulse space-y-4 h-72"></div>
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl animate-pulse space-y-4 h-72"></div>
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl animate-pulse space-y-4 h-72"></div>
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl animate-pulse space-y-4 h-72"></div>
    </div>

    <!-- Live Cards Grid -->
    <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden">
      <!-- Injected via JS -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-20 bg-slate-900/40 rounded-2xl border border-slate-800/80">
      <span class="text-4xl mb-3 block">🔎</span>
      <h3 class="text-lg font-semibold text-slate-300">No matching records found</h3>
      <p class="text-sm text-slate-500 mt-1">Try adjusting your search query or sorting options.</p>
    </div>

  </main>

  <!-- Detail Modal -->
  <div id="detailModal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full max-h-[85vh] overflow-y-auto custom-scrollbar p-6 relative shadow-2xl">
      <button onclick="closeModal()" class="absolute right-4 top-4 text-slate-400 hover:text-white text-xl p-1 bg-slate-800 rounded-lg">✕</button>
      <div id="modalContent">
        <!-- Injected via JS -->
      </div>
    </div>
  </div>

  <!-- JavaScript Application Logic -->
  <script>
    let currentSource = 'products';
    let allData = [];
    let filteredData = [];

    const API_ENDPOINTS = {
      products: 'https://dummyjson.com/products?limit=24',
      users: 'https://jsonplaceholder.typicode.com/users'
    };

    // Switch Source
    function switchApi(source) {
      if (currentSource === source) return;
      currentSource = source;

      // Update Tab Styles
      const tabProducts = document.getElementById('tabProducts');
      const tabUsers = document.getElementById('tabUsers');

      if (source === 'products') {
        tabProducts.className = "px-4 py-1.5 text-xs font-semibold rounded-lg bg-blue-600 text-white shadow-sm transition";
        tabUsers.className = "px-4 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition";
        document.getElementById('sortSelect').style.display = 'block';
      } else {
        tabUsers.className = "px-4 py-1.5 text-xs font-semibold rounded-lg bg-blue-600 text-white shadow-sm transition";
        tabProducts.className = "px-4 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition";
        document.getElementById('sortSelect').style.display = 'none';
      }

      document.getElementById('searchInput').value = '';
      fetchCurrentApiData();
    }

    // Fetch REST API Data
    async function fetchCurrentApiData() {
      const skeleton = document.getElementById('loadingSkeleton');
      const grid = document.getElementById('cardsGrid');
      const emptyState = document.getElementById('emptyState');
      const statusText = document.getElementById('statusText');

      skeleton.classList.remove('hidden');
      grid.classList.add('hidden');
      emptyState.classList.add('hidden');
      statusText.innerText = `Connecting to ${currentSource.toUpperCase()} API...`;

      const startTime = performance.now();

      try {
        const response = await fetch(API_ENDPOINTS[currentSource]);
        if (!response.ok) throw new Error(`HTTP ${response.status} ${response.statusText}`);

        const json = await response.json();
        const duration = (performance.now() - startTime).toFixed(0);

        if (currentSource === 'products') {
          allData = json.products || [];
        } else {
          allData = Array.isArray(json) ? json : [];
        }

        statusText.innerText = `200 OK • Loaded ${allData.length} items in ${duration}ms`;
        applyFiltersAndRender();

      } catch (err) {
        console.error(err);
        statusText.innerText = `Fetch failed: ${err.message}`;
        skeleton.classList.add('hidden');
        emptyState.classList.remove('hidden');
      }
    }

    // Filter & Sort
    function applyFiltersAndRender() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const sortVal = document.getElementById('sortSelect').value;

      filteredData = allData.filter(item => {
        if (!query) return true;
        if (currentSource === 'products') {
          return (
            (item.title && item.title.toLowerCase().includes(query)) ||
            (item.category && item.category.toLowerCase().includes(query)) ||
            (item.brand && item.brand.toLowerCase().includes(query))
          );
        } else {
          return (
            (item.name && item.name.toLowerCase().includes(query)) ||
            (item.email && item.email.toLowerCase().includes(query)) ||
            (item.address && item.address.city.toLowerCase().includes(query)) ||
            (item.company && item.company.name.toLowerCase().includes(query))
          );
        }
      });

      // Sorting (Products only)
      if (currentSource === 'products') {
        if (sortVal === 'price-low') filteredData.sort((a, b) => a.price - b.price);
        else if (sortVal === 'price-high') filteredData.sort((a, b) => b.price - a.price);
        else if (sortVal === 'rating-high') filteredData.sort((a, b) => b.rating - a.rating);
        else if (sortVal === 'name-asc') filteredData.sort((a, b) => a.title.localeCompare(b.title));
      }

      renderGrid();
    }

    // Render Cards
    function renderGrid() {
      const skeleton = document.getElementById('loadingSkeleton');
      const grid = document.getElementById('cardsGrid');
      const emptyState = document.getElementById('emptyState');
      const resultsCount = document.getElementById('resultsCount');

      skeleton.classList.add('hidden');
      resultsCount.innerText = `Showing ${filteredData.length} of ${allData.length} records`;

      if (filteredData.length === 0) {
        grid.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      grid.classList.remove('hidden');

      if (currentSource === 'products') {
        grid.innerHTML = filteredData.map(p => `
          <div onclick="openProductModal(${p.id})" 
            class="bg-slate-900 border border-slate-800 hover:border-blue-500/50 p-4 rounded-2xl flex flex-col justify-between cursor-pointer transition transform hover:-translate-y-1 hover:shadow-xl hover:shadow-blue-500/10 group">
            <div>
              <div class="w-full h-40 bg-slate-800/80 rounded-xl overflow-hidden mb-3 flex items-center justify-center p-2 relative">
                <img src="${p.thumbnail}" alt="${p.title}" class="max-h-full max-w-full object-contain group-hover:scale-105 transition duration-300" loading="lazy" />
                <span class="absolute top-2 right-2 bg-slate-900/90 text-xs font-semibold px-2 py-0.5 rounded-md border border-slate-700 text-amber-400">
                  ★ ${p.rating}
                </span>
              </div>
              <div class="flex items-center gap-2 mb-1">
                <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-blue-600/20 text-blue-400 border border-blue-500/20">${p.category}</span>
              </div>
              <h3 class="font-bold text-sm text-slate-100 line-clamp-1 group-hover:text-blue-400 transition">${p.title}</h3>
              <p class="text-xs text-slate-400 line-clamp-2 mt-1">${p.description}</p>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between">
              <div>
                <span class="text-xs text-slate-500">Price</span>
                <p class="text-base font-extrabold text-emerald-400">$${p.price.toFixed(2)}</p>
              </div>
              <span class="text-xs font-semibold text-blue-400 group-hover:translate-x-1 transition">Details →</span>
            </div>
          </div>
        `).join('');
      } else {
        grid.innerHTML = filteredData.map(u => `
          <div onclick="openUserModal(${u.id})" 
            class="bg-slate-900 border border-slate-800 hover:border-indigo-500/50 p-5 rounded-2xl flex flex-col justify-between cursor-pointer transition transform hover:-translate-y-1 hover:shadow-xl hover:shadow-indigo-500/10 group">
            <div>
              <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white text-lg">
                  ${u.name.charAt(0)}
                </div>
                <div>
                  <h3 class="font-bold text-sm text-slate-100 group-hover:text-indigo-400 transition">${u.name}</h3>
                  <p class="text-xs text-slate-400">@${u.username}</p>
                </div>
              </div>
              <div class="space-y-1.5 text-xs text-slate-300">
                <p class="flex items-center gap-2">📧 <span class="truncate text-slate-400">${u.email}</span></p>
                <p class="flex items-center gap-2">📍 <span class="text-slate-400">${u.address.city}</span></p>
                <p class="flex items-center gap-2">🏢 <span class="truncate text-slate-400">${u.company.name}</span></p>
              </div>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between text-xs font-semibold text-indigo-400">
              <span>View Profile</span>
              <span class="group-hover:translate-x-1 transition">→</span>
            </div>
          </div>
        `).join('');
      }
    }

    // Modal Inspectors
    function openProductModal(id) {
      const p = allData.find(x => x.id === id);
      if (!p) return;

      const modalContent = document.getElementById('modalContent');
      modalContent.innerHTML = `
        <div class="space-y-4">
          <div class="flex gap-4 items-start">
            <img src="${p.thumbnail}" alt="${p.title}" class="w-28 h-28 object-contain bg-slate-800 p-2 rounded-xl border border-slate-700">
            <div>
              <span class="text-xs uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-blue-600/20 text-blue-400 border border-blue-500/20">${p.category}</span>
              <h2 class="text-xl font-bold text-white mt-1">${p.title}</h2>
              <p class="text-sm font-semibold text-emerald-400 mt-1">$${p.price.toFixed(2)} <span class="text-xs text-slate-400 font-normal">(${p.discountPercentage}% off)</span></p>
              <p class="text-xs text-amber-400 mt-0.5">Rating: ★ ${p.rating} / 5.0</p>
            </div>
          </div>
          <div>
            <h4 class="text-xs font-bold uppercase text-slate-400 mb-1">Description</h4>
            <p class="text-sm text-slate-300">${p.description}</p>
          </div>
          <div class="grid grid-cols-2 gap-3 text-xs bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
            <div><span class="text-slate-400">Brand:</span> <span class="font-semibold text-slate-200">${p.brand || 'N/A'}</span></div>
            <div><span class="text-slate-400">Stock Available:</span> <span class="font-semibold text-slate-200">${p.stock} units</span></div>
          </div>
          <div>
            <h4 class="text-xs font-bold uppercase text-slate-400 mb-1">Raw API JSON Payload</h4>
            <pre class="bg-slate-950 p-3 rounded-xl text-[11px] text-slate-300 font-mono overflow-x-auto custom-scrollbar border border-slate-800">${JSON.stringify(p, null, 2)}</pre>
          </div>
        </div>
      `;

      document.getElementById('detailModal').classList.remove('hidden');
    }

    function openUserModal(id) {
      const u = allData.find(x => x.id === id);
      if (!u) return;

      const modalContent = document.getElementById('modalContent');
      modalContent.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center gap-3">
            <div class="w-14 h-14 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xl text-white">
              ${u.name.charAt(0)}
            </div>
            <div>
              <h2 class="text-xl font-bold text-white">${u.name}</h2>
              <p class="text-xs text-slate-400">Username: @${u.username} • ID: #${u.id}</p>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
            <div><span class="text-slate-400">Email:</span> <p class="font-medium text-slate-200">${u.email}</p></div>
            <div><span class="text-slate-400">Phone:</span> <p class="font-medium text-slate-200">${u.phone}</p></div>
            <div><span class="text-slate-400">Website:</span> <p class="font-medium text-blue-400">${u.website}</p></div>
            <div><span class="text-slate-400">City / Zip:</span> <p class="font-medium text-slate-200">${u.address.city}, ${u.address.zipcode}</p></div>
            <div class="col-span-2"><span class="text-slate-400">Company:</span> <p class="font-medium text-slate-200">${u.company.name} - <i>"${u.company.catchPhrase}"</i></p></div>
          </div>
          <div>
            <h4 class="text-xs font-bold uppercase text-slate-400 mb-1">Raw API JSON Payload</h4>
            <pre class="bg-slate-950 p-3 rounded-xl text-[11px] text-slate-300 font-mono overflow-x-auto custom-scrollbar border border-slate-800">${JSON.stringify(u, null, 2)}</pre>
          </div>
        </div>
      `;

      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    // Search event
    document.getElementById('searchInput').addEventListener('input', applyFiltersAndRender);

    // Initial fetch on load
    fetchCurrentApiData();
  </script>
</body>
</html>
