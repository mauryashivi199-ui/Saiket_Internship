<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina Blog | Stories, Tech & Design Insights</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Newsreader / Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['Newsreader', 'serif'],
          },
          colors: {
            brand: {
              50: '#fdf8f6',
              100: '#f2e8e5',
              500: '#ea580c',
              600: '#c2410c',
              900: '#431407',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex flex-col antialiased selection:bg-orange-500 selection:text-white">

  <!-- Navigation Bar -->
  <nav class="sticky top-0 z-40 bg-[#0b0f19]/80 backdrop-blur-md border-b border-slate-800/80 px-4 md:px-8 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <a href="index.html" class="flex items-center gap-2.5 group">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-orange-500 via-amber-500 to-rose-500 flex items-center justify-center text-white font-black text-lg shadow-lg shadow-orange-500/20 group-hover:scale-105 transition">
          L
        </div>
        <div>
          <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-orange-200 bg-clip-text text-transparent">Lumina</span>
          <span class="hidden sm:inline-block ml-2 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider bg-orange-500/10 text-orange-400 border border-orange-500/20 rounded-full">Task 3</span>
        </div>
      </a>

      <!-- Search Bar -->
      <div class="relative flex-1 max-w-md hidden md:block">
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm">🔍</span>
        <input type="text" id="navbarSearch" placeholder="Search stories, topics, or authors..."
          class="w-full bg-slate-900/90 border border-slate-800 rounded-full pl-10 pr-4 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-orange-500/50 focus:ring-1 focus:ring-orange-500/50 transition">
      </div>

      <!-- Navigation Links -->
      <div class="flex items-center gap-2 sm:gap-3">
        <a href="index.html" class="px-3 py-1.5 text-xs font-semibold text-orange-400 bg-orange-500/10 rounded-full transition">Home</a>
        <a href="dashboard.html" class="px-3 py-1.5 text-xs font-medium text-slate-400 hover:text-white rounded-full hover:bg-slate-800/60 transition">Dashboard</a>
        <a href="create.html" 
          class="flex items-center gap-1.5 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg shadow-orange-500/20 transition transform active:scale-95">
          <span>✍️</span> Write Story
        </a>
      </div>

    </div>
  </nav>

  <!-- Hero Featured Article Banner -->
  <section class="max-w-7xl mx-auto px-4 md:px-8 pt-8 pb-4 w-full">
    <div id="featuredArticleContainer">
      <!-- Injected by JavaScript -->
    </div>
  </section>

  <!-- Topics & Category Filter Bar -->
  <section class="max-w-7xl mx-auto px-4 md:px-8 py-4 w-full">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800/80 pb-4">
      
      <!-- Category Pills -->
      <div class="flex items-center gap-2 overflow-x-auto py-1 custom-scrollbar" id="categoryTabs">
        <button onclick="filterCategory('ALL')" class="cat-pill active px-4 py-1.5 rounded-full text-xs font-bold bg-white text-slate-950 transition whitespace-nowrap shadow-sm">All Stories</button>
        <button onclick="filterCategory('Artificial Intelligence')" class="cat-pill px-4 py-1.5 rounded-full text-xs font-medium bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition whitespace-nowrap">Artificial Intelligence</button>
        <button onclick="filterCategory('Web Engineering')" class="cat-pill px-4 py-1.5 rounded-full text-xs font-medium bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition whitespace-nowrap">Web Engineering</button>
        <button onclick="filterCategory('UI/UX Design')" class="cat-pill px-4 py-1.5 rounded-full text-xs font-medium bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition whitespace-nowrap">UI/UX Design</button>
        <button onclick="filterCategory('BOOKMARKED')" class="cat-pill px-4 py-1.5 rounded-full text-xs font-medium bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition whitespace-nowrap flex items-center gap-1">
          <span>🔖</span> Saved Stories
        </button>
      </div>

      <!-- Feed Count & Storage Status -->
      <div class="flex items-center gap-3 text-xs text-slate-500 whitespace-nowrap">
        <span class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span> LocalStorage Synced
        </span>
        <span class="text-slate-700">|</span>
        <span id="postCountBadge">3 articles</span>
      </div>

    </div>
  </section>

  <!-- Main Blog Grid -->
  <main class="max-w-7xl mx-auto px-4 md:px-8 py-8 w-full flex-1">
    <div id="articlesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Injected by JavaScript -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-20 bg-slate-900/30 rounded-3xl border border-slate-800/60 p-8">
      <div class="w-16 h-16 rounded-2xl bg-orange-500/10 text-orange-400 flex items-center justify-center text-3xl mx-auto mb-4 border border-orange-500/20">📭</div>
      <h3 class="text-xl font-bold text-white mb-1">No articles found in this category</h3>
      <p class="text-sm text-slate-400 max-w-sm mx-auto mb-6">Start writing your first story or select another topic.</p>
      <a href="create.html" class="inline-flex items-center gap-2 px-6 py-2.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold text-xs rounded-full shadow-lg shadow-orange-500/20">
        ✍️ Write New Story
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800/80 bg-[#070a12] py-8 px-4 md:px-8 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="font-bold text-slate-300">Lumina Editorial</span> • Saiket Internship Assignment Task 3
      </div>
      <div class="flex items-center gap-4 text-slate-400">
        <a href="index.html" class="hover:text-white">Home</a>
        <a href="create.html" class="hover:text-white">Publish</a>
        <a href="dashboard.html" class="hover:text-white">Dashboard</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="storage.js"></script>
  <script>
    let currentCategory = 'ALL';
    let searchQuery = '';

    function renderPage() {
      const posts = getAllPosts();
      const featuredContainer = document.getElementById('featuredArticleContainer');
      const grid = document.getElementById('articlesGrid');
      const emptyState = document.getElementById('emptyState');
      const countBadge = document.getElementById('postCountBadge');

      // Filter
      const filtered = posts.filter(p => {
        if (currentCategory === 'BOOKMARKED') {
          return isBookmarked(p.id);
        }
        const matchCat = currentCategory === 'ALL' || p.category === currentCategory;
        const matchQuery = !searchQuery || 
          p.title.toLowerCase().includes(searchQuery) ||
          p.content.toLowerCase().includes(searchQuery) ||
          p.author.toLowerCase().includes(searchQuery);
        return matchCat && matchQuery;
      });

      countBadge.innerText = `${filtered.length} stories`;

      // 1. Render Featured Article (First article if ALL)
      if (filtered.length > 0 && currentCategory === 'ALL' && !searchQuery) {
        const feat = filtered[0];
        featuredContainer.innerHTML = `
          <div class="relative bg-gradient-to-br from-slate-900 via-slate-900/90 to-[#1e130c] border border-slate-800 rounded-3xl overflow-hidden p-6 md:p-10 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center shadow-2xl group">
            <div class="lg:col-span-7 space-y-4">
              <div class="flex items-center gap-2">
                <span class="px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider bg-orange-500/20 text-orange-400 border border-orange-500/30">
                  Featured Story • ${feat.category}
                </span>
                <span class="text-xs text-slate-500">• ${feat.readTime}</span>
              </div>
              <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold font-serif leading-tight text-white group-hover:text-orange-200 transition">
                <a href="post.html?id=${feat.id}">${feat.title}</a>
              </h1>
              <p class="text-sm md:text-base text-slate-300 line-clamp-3 leading-relaxed font-sans font-normal">
                ${feat.excerpt}
              </p>
              <div class="pt-3 flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <img src="${feat.authorAvatar}" alt="${feat.author}" class="w-10 h-10 rounded-full object-cover border border-slate-700">
                  <div>
                    <p class="text-xs font-bold text-white">${feat.author}</p>
                    <p class="text-[11px] text-slate-400">${feat.date}</p>
                  </div>
                </div>
                <a href="post.html?id=${feat.id}" class="inline-flex items-center gap-1.5 text-xs font-bold text-orange-400 hover:text-orange-300 transition">
                  Read Full Story <span>→</span>
                </a>
              </div>
            </div>
            <div class="lg:col-span-5 h-64 lg:h-80 rounded-2xl overflow-hidden relative">
              <a href="post.html?id=${feat.id}">
                <img src="${feat.coverImage}" alt="${feat.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700" />
              </a>
            </div>
          </div>
        `;
        featuredContainer.classList.remove('hidden');
      } else {
        featuredContainer.innerHTML = '';
        featuredContainer.classList.add('hidden');
      }

      // 2. Render Grid
      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      
      // If featured is displayed, skip 0th index in grid if ALL
      const displayList = (currentCategory === 'ALL' && !searchQuery && filtered.length > 1) ? filtered.slice(1) : filtered;

      grid.innerHTML = displayList.map(post => `
        <article class="bg-slate-900/70 border border-slate-800/90 hover:border-orange-500/40 rounded-3xl overflow-hidden flex flex-col justify-between transition-all duration-300 hover:-translate-y-1.5 hover:shadow-2xl hover:shadow-orange-500/5 group">
          <div>
            <!-- Cover Image -->
            <a href="post.html?id=${post.id}" class="block h-48 w-full overflow-hidden relative bg-slate-800">
              <img src="${post.coverImage}" alt="${post.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy" />
              <span class="absolute top-3 left-3 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-slate-950/80 backdrop-blur text-orange-400 border border-slate-700">
                ${post.category}
              </span>
            </a>

            <!-- Content Area -->
            <div class="p-6">
              <div class="flex items-center gap-2 text-xs text-slate-500 mb-2">
                <span>${post.date}</span>
                <span>•</span>
                <span>${post.readTime}</span>
              </div>
              <h2 class="text-lg font-bold font-serif text-white group-hover:text-orange-200 transition line-clamp-2 mb-2 leading-snug">
                <a href="post.html?id=${post.id}">${post.title}</a>
              </h2>
              <p class="text-xs text-slate-400 line-clamp-3 leading-relaxed font-sans">
                ${post.excerpt}
              </p>
            </div>
          </div>

          <!-- Card Footer -->
          <div class="px-6 py-4 border-t border-slate-800/80 flex items-center justify-between bg-slate-900/40">
            <div class="flex items-center gap-2.5">
              <img src="${post.authorAvatar}" alt="${post.author}" class="w-7 h-7 rounded-full object-cover border border-slate-700">
              <span class="text-xs font-medium text-slate-300 truncate max-w-[100px]">${post.author}</span>
            </div>
            
            <div class="flex items-center gap-2">
              <button onclick="handleLike(${post.id})" class="flex items-center gap-1 text-xs text-slate-400 hover:text-rose-400 transition px-2 py-1 rounded-lg hover:bg-slate-800">
                <span>❤️</span> <span class="font-bold">${post.likes || 0}</span>
              </button>
              <button onclick="handleBookmark(${post.id})" class="text-xs text-slate-400 hover:text-amber-400 transition p-1.5 rounded-lg hover:bg-slate-800" title="Bookmark">
                ${isBookmarked(post.id) ? '🔖' : '📑'}
              </button>
            </div>
          </div>
        </article>
      `).join('');
    }

    function filterCategory(cat) {
      currentCategory = cat;
      const pills = document.querySelectorAll('.cat-pill');
      pills.forEach(p => {
        if (p.innerText.includes(cat) || (cat === 'ALL' && p.innerText === 'All Stories') || (cat === 'BOOKMARKED' && p.innerText.includes('Saved'))) {
          p.className = "cat-pill active px-4 py-1.5 rounded-full text-xs font-bold bg-white text-slate-950 transition whitespace-nowrap shadow-sm";
        } else {
          p.className = "cat-pill px-4 py-1.5 rounded-full text-xs font-medium bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition whitespace-nowrap";
        }
      });
      renderPage();
    }

    function handleLike(id) {
      toggleLikePost(id);
      renderPage();
    }

    function handleBookmark(id) {
      toggleBookmark(id);
      renderPage();
    }

    document.getElementById('navbarSearch').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderPage();
    });

    // Initial Load
    initStorage();
    renderPage();
  </script>
</body>
</html>
